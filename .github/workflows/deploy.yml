name: Deploy to Server

on:
  push:
    branches:
      - main
      

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Deploy Code
        run: |
          cd /home/deep/GUARDIAN
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          docker compose -f docker-compose.yml up --build --force-recreate -d