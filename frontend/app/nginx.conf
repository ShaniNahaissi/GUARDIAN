server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + streaming (Docker Compose: browser talks to nginx only; same-origin /api)
    location /api/ {
        proxy_pass https://guardian-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sw/ {
        proxy_pass https://guardian-backend:8000;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /consumer/ {
        proxy_pass https://guardian-backend:8000/consumer/;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass https://guardian-backend:8000/health;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
    }

    # Support React SPA routing (send all routes to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
