# Prefer repo-root `docker-compose.yml` (includes Postgres + frontend).
# This file is for running only backend + DB from the `backend/` directory.

services:
  postgres:
    image: postgres:16-alpine
    container_name: guardian-postgres-backend-compose
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
      POSTGRES_DB: guardian
    volumes:
      - guardian_pg_backend:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  guardian-backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      GUARDIAN_DATABASE_URL: postgresql+asyncpg://guardian:guardian@postgres:5432/guardian
      GUARDIAN_JWT_SECRET: ${GUARDIAN_JWT_SECRET:-change-me-in-production}
      GUARDIAN_ADMIN_USERNAME: ${GUARDIAN_ADMIN_USERNAME:-Admin}
      GUARDIAN_ADMIN_PASSWORD: ${GUARDIAN_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  guardian_pg_backend:
