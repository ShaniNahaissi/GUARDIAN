services:
  postgres:
    image: postgres:16-alpine
    container_name: guardian-postgres-dev
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
      POSTGRES_DB: guardian
    volumes:
      - guardian_pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  guardian-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: guardian-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      # Windows/macOS Docker bind mounts often miss inotify; polling makes --reload reliable
      WATCHFILES_FORCE_POLLING: "true"
      GUARDIAN_DATABASE_URL: postgresql+asyncpg://guardian:guardian@postgres:5432/guardian
      GUARDIAN_JWT_SECRET: ${GUARDIAN_JWT_SECRET:-dev-secret-change-me}
      GUARDIAN_ADMIN_USERNAME: ${GUARDIAN_ADMIN_USERNAME:-Admin}
      GUARDIAN_ADMIN_PASSWORD: ${GUARDIAN_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

