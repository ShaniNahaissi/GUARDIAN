services:
  guardian-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: guardian-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      # Windows/macOS Docker bind mounts often miss inotify; polling makes --reload reliable
      WATCHFILES_FORCE_POLLING: "true"
    restart: unless-stopped

