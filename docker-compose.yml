services:
  guardian-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: guardian-backend
    ports:
      - "443:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl,urllib.request; c=ssl.create_default_context(); c.check_hostname=False; c.verify_mode=ssl.CERT_NONE; urllib.request.urlopen('https://127.0.0.1:8000/health', context=c, timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  guardian-frontend:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: /api
    container_name: guardian-frontend
    ports:
      - "80:80"
    depends_on:
      guardian-backend:
        condition: service_healthy
    restart: unless-stopped
