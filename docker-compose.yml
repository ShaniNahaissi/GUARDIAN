services:
  postgres:
    image: postgres:16-alpine
    container_name: guardian-postgres
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
      POSTGRES_DB: guardian
    volumes:
      - guardian_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  guardian-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: guardian-backend
    ports:
      - "8000:8000"
    environment:
      GUARDIAN_DATABASE_URL: postgresql+asyncpg://guardian:guardian@postgres:5432/guardian
      GUARDIAN_JWT_SECRET: ${GUARDIAN_JWT_SECRET:-change-me-in-production}
      GUARDIAN_ADMIN_USERNAME: ${GUARDIAN_ADMIN_USERNAME:-Admin}
      GUARDIAN_ADMIN_PASSWORD: ${GUARDIAN_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl,urllib.request; c=ssl.create_default_context(); c.check_hostname=False; c.verify_mode=ssl.CERT_NONE; urllib.request.urlopen('https://127.0.0.1:8000/health', context=c, timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  guardian-frontend:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: /api
    container_name: guardian-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      guardian-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  guardian_pg_data:
